<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2d45" />
    <title>No connection · Daily Notes</title>
    <style>
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 24px; background: #f5f1ea; color: #0f2d45;
        font-family: -apple-system, system-ui, sans-serif; text-align: center;
      }
      .card {
        max-width: 22rem; background: #fff; border-radius: 1rem; padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(15, 45, 69, 0.08);
      }
      img { height: 3rem; width: auto; object-fit: contain; margin-bottom: 1rem; }
      h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; color: #536779; margin: 0 0 0.75rem; }
      button {
        border: 0; border-radius: 0.75rem; background: #0f2d45; color: #fff;
        font-weight: 600; padding: 0.75rem 1.25rem; font-size: 0.875rem; min-height: 44px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand/AHFS_logo.png" alt="" />
      <h1>No connection</h1>
      <p>
        This phone can't reach the notes server. Check that you're on the house
        wifi and the office computer is running.
      </p>
      <p><strong>Anything you were typing is still saved on this phone</strong>
        and will be here when you reconnect.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
